{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{% static 'css/joga.css' %}">
</head>
<body>

    {% include "header.html" %}

    <main style="max-width: 400px; margin: 80px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; font-family: sans-serif;">
        <h2 style="text-align: center; margin-bottom: 20px;">Авторизация</h2>
        
        <form method="post" id="loginForm">
            {% csrf_token %} 
            
            <div style="margin-bottom: 15px;">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="cta-button" style="width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
                Войти
            </button>
        </form>
    </main>

</body>
</html>
